name: linux
on:
  push:
    branches:
      - tyre2X
      - tyre2X-dev
    tags:
      - '*'
  pull_request: {}
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc]
        build_type: [RelWithDebInfo]
        server_only: [OFF]
        exclude:
          - os: macos-latest
            compiler: gcc
          - os: macos-latest
            build_type: Debug

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1
          submodules: true
      - name: Configure packaging name for git master branch
        if: ${{ github.ref == 'refs/heads/tyre2X' }}
        run: |
          echo "release_tag=git`date +%Y%m%d`" >> $GITHUB_ENV
      - name: Configure packaging name for tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "release_tag=git`date +%Y%m%d`" >> $GITHUB_ENV
      - name: Configure packaging name for non-releasing branch
        if: ${{ !(github.ref == 'refs/heads/tyre2X' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          echo "release_tag=git`date +%Y%m%d`" >> $GITHUB_ENV
      - name: Affirm_non-prerelease
        run: |
          echo "release_pre=false" >> $GITHUB_ENV
      - name: Show packaging name
        run : |
          echo "${{ env.release_tag }}"
          echo "${{ env.release_pre }}"
      - name: Install linux dependencies
        run: |
          sudo apt-get update 
          sudo apt install -y build-essential cmake libbluetooth-dev libcurl4-gnutls-dev \
          libfreetype6-dev libharfbuzz-dev libjpeg-dev libogg-dev libopenal-dev \
          libpng-dev libsdl2-dev libvorbis-dev pkg-config zlib1g-dev chrpath
          git clone https://github.com/Nomagno/stk-assets
          mv stk-assets ..
      - name: Set compiler (gcc)
        run: |
          echo "CXX=g++" >> $GITHUB_ENV
          echo "CC=gcc" >> $GITHUB_ENV
      - name: Configure build (linux)
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          SERVER_ONLY: ${{ matrix.server_only }}
        run: |
          cmake --version
          $CXX --version
          mkdir "build"
          cd "build"
          cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DSERVER_ONLY=$SERVER_ONLY -DBUILD_RECORDER=off -DNO_SHADERC=on;
      - name: Build and install
        working-directory: build
        run: |
          make -j8 VERBOSE=1
          cd ..
          mv build build-linux-x86_64
          tools/linux_builder.sh
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          path: "build-linux-install/SuperTuxKart-${{ env.release_tag }}-linux-x86_64.tar.gz"
